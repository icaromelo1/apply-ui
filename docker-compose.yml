services:
  apply-ui:
    build: .
    container_name: apply-ui
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.http.routers.apply-ui.rule=Host(`apply.icaromelodev.com.br`)
      - traefik.http.routers.apply-ui.entrypoints=websecure
      - traefik.http.routers.apply-ui.tls.certresolver=le
      # O painel expõe dados pessoais (nome, telefone, pretensão) — nunca público.
      - traefik.http.routers.apply-ui.middlewares=apply-auth
      - traefik.http.middlewares.apply-auth.basicauth.users=${APPLY_AUTH}
      - traefik.http.services.apply-ui.loadbalancer.server.port=3000
networks:
  web: {external: true}
